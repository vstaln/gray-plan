[package]
name = "gray-plan"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "A read-only planning mode for safer repository exploration"

[[bin]]
name = "gray-plan"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"

[profile.release]
strip = true
